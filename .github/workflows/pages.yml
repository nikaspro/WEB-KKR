name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/upload-files-repo-utgsi7
      - main
      - hotels
  pull_request:
    branches:
      - claude/upload-files-repo-utgsi7
      - main
      - hotels
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: hotels-source
          ref: hotels

      - name: Checkout published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: published-source
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: hotels-source/hotel-page-current/.nvmrc
          cache: npm
          cache-dependency-path: |
            hotels-source/hotel-page-current/package-lock.json
            published-source/package-lock.json

      - name: Install published dependencies
        working-directory: published-source
        run: npm ci

      - name: Install preview dependencies
        working-directory: hotels-source/hotel-page-current
        run: npm ci

      - name: Build published page
        working-directory: published-source
        run: npm run build
        env:
          SITE_BASE_PATH: /WEB-KKR/

      - name: Build hotels preview
        working-directory: hotels-source/hotel-page-current
        run: npm run build
        env:
          SITE_BASE_PATH: /WEB-KKR/hotels/

      - name: Check production budget
        working-directory: published-source
        continue-on-error: true
        run: npm run budget

      - name: Check animation phases
        working-directory: published-source
        continue-on-error: true
        run: npm run phases:check

      - name: Check legacy entry and embedded assets
        working-directory: published-source
        continue-on-error: true
        run: npm run legacy:check

      - name: Combine published page and hotels preview
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p site/hotels
          cp -R published-source/dist/. site/
          cp -R hotels-source/hotel-page-current/dist/. site/hotels/
          while IFS= read -r -d '' file; do
            sed -i 's#^/assets/#/WEB-KKR/hotels/assets/#g; s#\(["\x27(= ]\)/assets/#\1/WEB-KKR/hotels/assets/#g' "$file"
          done < <(find site/hotels -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0)

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
